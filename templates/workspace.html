{% extends "base.html" %}
{% from "icons.html" import icon %}

{% block title %}工作台 · 个人笔记{% endblock %}

{% block content %}
  <div class="page-head">
    <h1 class="page-title">工作台</h1>
    <span class="page-head__rule" aria-hidden="true"></span>
    <div class="page-head__actions">
      <a class="btn btn--primary" href="/notes/new">新建文章</a>
      <a class="btn btn--outline" href="/notes">我的文章</a>
    </div>
  </div>

  <div class="stat-grid">
    <div class="card stat-card">
      <span class="stat-card__value" id="stat-draft">0</span>
      <span class="stat-card__label">草稿</span>
    </div>
    <div class="card stat-card">
      <span class="stat-card__value" id="stat-published">0</span>
      <span class="stat-card__label">已发布</span>
    </div>
    <div class="card stat-card">
      <span class="stat-card__value" id="stat-favorite">0</span>
      <span class="stat-card__label">收藏</span>
    </div>
  </div>

  <section class="card">
    <h2 class="card__title">最近文章</h2>
    <div class="note-list" id="recent-list">
      <div class="loading"><span class="spinner"></span>加载中…</div>
    </div>
    <div class="empty" id="recent-empty" hidden>
      <span class="empty__icon">{{ icon("note", 40) }}</span>
      <p>还没有文章，点"新建文章"开始记录</p>
      <a class="btn btn--primary" href="/notes/new">新建文章</a>
    </div>
  </section>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/workspace.js') }}"></script>
{% endblock %}
